# ============================================================================
# 口径陷阱（建模前必读）
# ============================================================================
notes:
  - key: ebit 与 operating_profit 的桥
    text: >
      ebit = 营业收入 − 营业成本 − operating_expenses，其中 operating_expenses **不含**财务费用，
      因此 ebit 与年报的 operating_profit 必然不等。差额 = −financial_expenses + 其他收益 + 投资收益
      + 公允价值变动收益 + 信用 / 资产减值损失 + 资产处置收益 等非营业项目。
      逐期差额（operating_profit − ebit）：2024A 60.50 − 58.96 = 1.54 亿元（其中财务费用为
      −1.44 亿元，即净收益，另有约 0.09 亿元其他项目）；2025A 135.97 − 133.94 = 2.03 亿元；
      2026H1 172.31 − 170.73 = 1.58 亿元。**不要把 ebit 当 operating_profit 用**。
      2021A / 2022A / 2023A 因缺期间费用明细，ebit 为 null（见 gaps）。
  - key: 累计 vs 单季
    text: >
      本文件所有期间均为**累计口径**：2021A—2025A 为 1—12 月，2026H1 为 1—6 月。
      2026H1 与年报期不可直接比增速，须年化或与 2025H1 比（源文件另给 2025H1 同期数）。
  - key: 归母 vs 含少数股东
    text: >
      net_income 为**含少数股东**的净利润，net_income_attributable 为**归母净利润**，
      minority_interest 单列。估值用的「归母口径」应取 net_income_attributable。
      少数股东损益占比在上升（2021A 0.10 → 2026H1 10.82 亿元），两者差异不可忽略。
  - key: 有息负债口径逐年变化（重要）
    text: >
      上年报的「官方带息债务」（利率风险附注）**只含银行借款**（短期借款 + 一年内到期的长期借款
      + 长期借款），**不含租赁负债**；2026H1 半年报无利率风险附注，官方带息债务未披露。
      本文件统一按任务口径 = 短期借款 + 一年内到期的长期借款 + 长期借款 + 应付债券 + 租赁负债，
      取值与来源逐项如下：
        2021A 25.42 亿元 —— 文件未给合计，按构成加总（短期借款 7.94 + 一年内到期长期借款 4.77
          + 长期借款 12.62 + 租赁负债 0.09），其中一年内到期长期借款 4.77 亿元为源文件给的
          两位小数近似值，故 2021A 该项精度低于其他期。
        2022A 19.16 亿元 —— 文件给的「借款类有息负债合计」1,913,464,300.00 元不含租赁负债，
          已加回租赁负债 2,396,845.57 元。
        2023A 8.65 亿元 —— 文件给的「借款类有息负债合计」848,068,220.00 元不含租赁负债，
          已加回租赁负债 17,040,189.24 元。
        2024A 26.34 亿元 —— 直接取 2025 年报给的同口径计算合计 2,634,208,528.75 元
          （2024 年报自己给的 2,611,033,434.40 元不含租赁负债）。
        2025A 15.67 亿元 —— 直接取 2025 年报计算合计 1,566,657,320.17 元。
        2026H1 17.37 亿元 —— 直接取 2026 半年报计算合计 1,736,603,875.33 元。
      另：**长期应付款单列、未计入本字段**（2023A 0.21 亿元、2024A 8.80 亿元、2025A 9.00 亿元、
      2026H1 50.57 亿元），源文件明确其是否计息、是否算有息负债**需由 valuation 判断**；
      2026H1 该项以美元计价（742,502,377.41 美元），半年内从 9.00 亿元增至 50.57 亿元。
  - key: 股本变动（跨期比每股指标必看）
    text: >
      逐期期末总股本（亿股）与当年变动原因：
        2021A 8.0010 —— 向特定对象发行 87,080,000 股（2021-11）− 回购注销限制性股票 148,855 股。
        2022A 8.0096 —— 回购注销 431,843 股 + 股权激励归属 1,297,350 股。
        2023A 8.0283 —— 仅股权激励归属 1,864,450 股，无转增、无送股。
        2024A 11.2117 —— **资本公积每 10 股转增 4 股（转增 315,628,721 股，2024-06-06 实施）**
          + 股权激励归属 2,711,550 股。股本一年增 39.65%，**每股指标因此断档**。
        2025A 11.1112 —— 注销回购股份 16,465,985 股 + 股权激励归属 6,417,810 股。
        2026H1 11.1523 —— 股权激励归属 4,116,307 股。
      因 2024 年 6 月转增，2021A—2023A 的 basic_eps / diluted_eps 与 2024A 起**不同股本口径**，
      直接连成序列会失真。
  - key: 每股收益口径（跨报告期冲突）
    text: >
      2023A 的 basic_eps / diluted_eps 取 **2024 年报 p.8 追溯调整后**的 2.00 / 1.97 元
      （便于与 2024A 的 4.72 / 4.63 衔接）；2023 年报 p.8 当年原披露数为 2.80 / 2.76 元
      （2.80 ÷ 1.4 = 2.00，差额全部来自 2024 年 6 月的资本公积转增）。两版都对，
      引用时须注明所用版本。2021A、2022A 的每股收益为转增前口径，未做还原。
  - key: 毛利率舍入
    text: >
      派生字段按本文件的 2 位小数亿元字段计算。2021A 毛利率算得 0.2558（年报披露 25.57%）、
      2025A 算得 0.4203（年报披露 42.04%），各差 0.01pp，全部来自先舍入再运算。
      2022A（0.2931 vs 29.31%）、2023A（0.3299 vs 32.99%）、2024A（0.3380 vs 33.80%）、
      2026H1（0.4625 vs 46.25%）与年报一致。
  - key: 期间费用定义与旧模板冲突
    text: >
      model/inputs/historical.yaml 旧模板注释把 operating_expenses 定义为
      「销售 + 管理 + 研发 + **财务**」；本文件按本次任务口径为
      「税金及附加 + 销售 + 管理 + 研发」，**不含财务费用**。旧的假设模板
      （tools/model/synthetic、model/assumptions/candidate.yaml）里的 opex_ratio
      若按含财务费用的口径标定，切换到本文件后须重新标定。

# ============================================================================
# 数据缺口（取不到就留 null，不填 0、不估算）
# ============================================================================
gaps:
  - field: taxes_and_surcharges
    period: "2021A / 2022A / 2023A"
    reason: 这三份年报文件只摘录了营业成本与研发费用，未摘录「税金及附加」；期间费用只能整体反推（见下一条）。
  - field: selling_expenses
    period: "2021A / 2022A / 2023A"
    reason: 同上，三份文件未摘录「销售费用」。
  - field: admin_expenses
    period: "2021A / 2022A / 2023A"
    reason: 同上，三份文件未摘录「管理费用」。
  - field: financial_expenses
    period: "2021A / 2022A / 2023A"
    reason: 2021A、2022A 文件未摘录利润表「财务费用」；2023A 只给了现金流量表补充资料口径 0.49 亿元，与利润表口径不同（2024A 两口径分别为 −1.44 与 0.36 亿元），不可替代，故留空。
  - field: interest_expense
    period: 2021A
    reason: 2021 年报文件未摘录「财务费用—利息费用」，其数据缺口节亦未给出，故 EBITDA 也无法推算。
  - field: income_tax
    period: "2021A / 2025A"
    reason: 两份文件未直接摘录「所得税费用」（可由利润总额 − 净利润精确反推：2021A 0.73 亿元、2025A 20.20 亿元），未直接披露故留空。
  - field: operating_expenses
    period: "2021A / 2022A / 2023A"
    reason: 该字段 = 税金及附加 + 销售费用 + 管理费用 + 研发费用，其中前三项未披露，无法拆分。可用下界参考：营业总成本 − 营业成本 − 研发费用 = 2021A 6.12 亿元、2022A 6.38 亿元、2023A 5.25 亿元（该合计数含财务费用，故只能作为上界参考，不能直接当 operating_expenses）。
  - field: ebit
    period: "2021A / 2022A / 2023A"
    reason: 依赖 operating_expenses，随之缺失。替代口径（利润总额 + 利息费用，标准 EBIT 定义）在 2022A = 14.15 亿元、2023A = 25.34 亿元；2021A 因缺利息费用连替代口径也算不出。任务口径与替代口径不同，故不写入本字段。
  - field: ebitda
    period: 2021A
    reason: 2021 年报未披露，且推算所需的「利息费用」缺失，无法按「利润总额 + 利息费用 + 折旧摊销」口径得出。
  - field: accounts_receivable
    period: "2021A / 2022A / 2023A"
    reason: 三份文件未摘录「应收账款」期末余额（2024A 起才有：2025 年报 p.90 比较列）。
  - field: accounts_payable
    period: all
    reason: 全部六份文件均未摘录「应付账款」，需回各期资产负债表原文补齐。
  - field: prepayments
    period: all
    reason: 全部六份文件均未摘录「预付款项」。仅 2026 一季报提到预付材料款同比 +1,009.48%，无金额。
  - field: cash
    period: "2023A / 2024A"
    reason: 两份年报文件未摘录「货币资金」。2024A 另有期末现金及现金等价物余额 4,987,790,480.51 元（2025 年报 p.99），但那是扣除受限资金后的口径（2025 年末两者相差 0.43 亿元 = 受限货币资金），不可当货币资金用。
  - field: ppe_net
    period: "2023A / 2024A / 2025A / 2026H1"
    reason: 四份报告文件未摘录「固定资产」期末账面净额（仅 2021A、2022A 有完整元级原值）。2025 年报只给了受限固定资产 0.45 亿元，非全额。
  - field: shares_outstanding
    period: 2023A
    reason: 该期数值本身取自 2023 年报，可查；此处仅提示：2023 年报 p.85—87 三处文字表述的股权激励归属股数有出入（1,547,100 / 1,864,450 股），本文件采 1,864,450 股（由 2024 年报 p.119 独立佐证，且与期初期末股本勾稽一致）。
