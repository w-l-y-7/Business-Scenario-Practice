# ============================================================================
# 中际旭创（300308.SZ / 3308.HK）历史财务输入
# 用途：统一估值模型的历史起点。本文件只放**已经发生的事实**，不含任何预测。
# 生成日期：2026-09-20
# ----------------------------------------------------------------------------
# 单位与口径（勿改）
#   - 金额：亿元（1 亿元 = 100,000,000 元），保留 2 位小数
#   - 股本：亿股，保留 4 位小数
#   - 每股金额：元，保留 2 位小数
#   - 比率：小数（0.4625 即 46.25%），保留 4 位小数
#   - 利润类一律区分「归母」与「含少数股东」，看字段名即可
#   - 资产负债表科目为**期末时点数**；利润表 / 现金流量表科目为**期间发生数**
#   - 各期均为**累计口径**（年报为 1—12 月，2026H1 为 1—6 月），**不是单季**
#   - 数据全部来自 raw_data/earnings/ 下的同名「关键指标」文件（A 级、逐项标页码），
#     每个数字都能回年报原文核对。取不到的一律 null，**不填 0、不估算**。
# ----------------------------------------------------------------------------
# 派生字段的计算约定（先读这条，否则会算出对不上的数）
#   operating_expenses / ebit / gross_profit / gross_margin 四个派生字段，一律由**本文件
#   里已经写进去的 2 位小数亿元字段**直接推算，保证「拿本文件的数能自己算回来」。
#   因为先四舍五入再运算，结果与「先用元级原值算、再转亿元」可能差 ≤0.02 亿元，
#   与年报披露的比率可能差 ≤0.01pp（已知 2021 年、2025 年毛利率各差 0.01pp）。
#
#   operating_expenses **不含** financial_expenses（利息单独建模），
#   所以 ebit 一定不等于年报的 operating_profit —— 桥见文件末尾 gaps 的 ebit 条目。
#   ⚠ model/inputs 旧模板的注释把「财务费用」也算进期间费用，本文件按本次任务口径
#      **不含**财务费用，两套口径不可混用。
# ============================================================================

