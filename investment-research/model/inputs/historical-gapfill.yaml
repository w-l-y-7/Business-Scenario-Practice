# ============================================================================
# 中际旭创（300308.SZ）历史财务输入 —— 缺失行项补录
# 生成日期：2026-09-20
# 用途：补齐 model/inputs/historical.yaml 中留空的行项，供其合并。
#       **本文件不修改 historical.yaml**，两者由不同流程分别维护。
# ----------------------------------------------------------------------------
# 单位与口径（勿改）
#   - 金额：**元**，与年报报表印制值完全一致，保留原文全部小数位；
#     合并进 historical.yaml 时再按 1 亿元 = 100,000,000 元换算成亿元。
#   - 资产负债表科目为**期末余额 / 年末余额**列（时点数）；
#     利润表科目为**本期金额**列（年报为 1—12 月累计数，2026H1 为 1—6 月累计数）。
#   - page 一律是 **PDF 物理页码**，与 pdf_to_text.py 插入的 `[[page N]]` 标记、
#     以及 PDF 阅读器显示的页码一致，可逐页回溯原文。
#   - 字段名沿用 historical.yaml 既有命名：admin_expenses（管理费用）、
#     financial_expenses（财务费用）、income_tax（所得税费用）、cash（货币资金）；
#     本文件新增 historical.yaml 尚无的 fixed_assets（固定资产）。
#   - 取不到的一律 null + reason，**不填 0、不估算、不外推**。
# ============================================================================

source_note: >
  本文件由 data-collector 从 raw_data/earnings/ 下的年报 PDF 原件补录。
  数值单位与原始报表一致（元），未做亿股/亿元换算 —— 合并进 historical.yaml 时再换算。
  每个数字都用 pdfplumber 直接在 PDF 原件上按物理页复检过一次，命中页码与下表一致。

notes:
  - 应付账款口径：六个报告期的合并资产负债表都把「应付账款」作为**独立行**列示，
    与「应付票据」分列（如 2021 年报 p.115 应付票据 235,950,374.83 / 应付账款 1,205,034,165.90）。
    没有任何一期在报表正面出现合并的「应付票据及应付账款」一行；
    该短语仅在 2025 年报 p.121、2026 半年报 会计政策「金融负债」段落的叙述文字里出现，
    与报表行项无关。故 accounts_payable 均按独立行填列，**未使用任何合并数**。

  - 利息费用（2021A）：「其中：利息费用」直接披露在**利润表正面**「财务费用」项下
    （p.120，82,987,065.77 元）；附注「66、财务费用」（2021 年报 p.208）披露同一数字
    82,987,065.77 元，两者一致。并非「附注未拆分」，故未置 null。

  - 财务费用（2023A）取**利润表口径** −83,570,188.60 元（p.104）。
    勿与现金流量表补充资料口径混淆：historical.yaml 已注明该年现金流量表补充资料口径
    为 48,573,215.82 元（2023 年报 p.200），两者含义不同。

  - 固定资产均取**期末账面价值**（净额），即资产负债表正面「固定资产」行的金额，
    未使用附注中「原值 / 累计折旧」的拆分口径。

  - 货币资金取**资产负债表正面**「货币资金」行，不是「期末现金及现金等价物余额」
    （后者已扣除受限资金，口径不同）。

  - 本次只补录任务指定的行项。2024A 与 2026H1 的合并利润表未指定行项，
    故其 income_statement 为空；2021A 未指定货币资金、固定资产，亦未填。

  - 交叉核对（全部通过）：各年〔期末余额〕与次年 / 次期期初余额逐项相等 ——
    应收账款 2021A 1,997,351,738.97 = 2022 期初；2022A 1,509,253,639.28 = 2023 期初；
    预付款项 2021A 72,294,071.65 = 2022 期初；2025A 134,110,191.04 = 2026H1 期初；
    应付账款 2021A 1,205,034,165.90 = 2022 期初；2022A 1,135,780,230.45 = 2023 期初；
    2025A 7,329,829,283.58 = 2026H1 期初；
    货币资金 2023A 3,317,278,482.26 = 2024 期初；2024A 5,053,805,073.94 = 2025 期初；
    固定资产 2023A 3,947,627,024.73 = 2024 期初；2024A 5,819,881,791.90 = 2025 期初；
    2025A 7,080,613,124.29 = 2026H1 期初。
    相邻年报的比较列也逐年对上：税金及附加（21,012,072.57 / 62,999,788.43 / 50,633,780.12）、
    销售费用（73,036,515.34 / 90,729,655.15 / 124,839,872.23）、
    管理费用（434,165,544.95 / 506,803,137.67 / 433,592,451.52）、
    财务费用（83,813,114.18 / −22,200,843.17）、利息费用 2021A 82,987,065.77，均与上年数一致。

  - 所得税费用与利润表自洽：
    2021A 利润总额 959,915,315.48 − 净利润 886,496,645.71 = 73,418,669.77 = income_tax（p.120）；
    2025A 利润总额 13,599,623,819.76 − 净利润 11,579,754,107.99 = 2,019,869,711.77 = income_tax（p.95）。

  - 营业总成本恒等式（口径确认，三年精确成立）：
    营业总成本 = 营业成本 + 税金及附加 + 销售费用 + 管理费用 + 研发费用 + 财务费用。
    2021A 5,727,399,864.53+21,012,072.57+73,036,515.34+434,165,544.95+541,099,309.92+83,813,114.18
      = 6,880,526,421.49 = 报表营业总成本 ✓（p.119—120）
    2022A 6,815,591,676.60+62,999,788.43+90,729,655.15+506,803,137.67+767,018,963.81−22,200,843.17
      = 8,220,942,378.49 = 报表营业总成本 ✓（p.106—107）
    2023A 7,181,877,357.45+50,633,780.12+124,839,872.23+433,592,451.52+739,367,582.40−83,570,188.60
      = 8,446,740,855.12 = 报表营业总成本 ✓（p.104）
    ⇒ 两条口径结论：① **税金及附加计入营业总成本，但在「营业成本」之外独立行列示**，
    即「营业成本」不含税金及附加；② **研发费用是独立一行，不并入「管理费用」**。
    因此若要复现报表口径，期间费用 = 税金及附加 + 销售费用 + 管理费用 + 研发费用，
    **不含**财务费用（与 historical.yaml 既有约定一致）。

  - 字段名映射：本文件的 fixed_assets（固定资产）即模型侧的 ppe_net（期末账面价值）。
    historical.yaml 尚无该字段，合并时按此映射落位。

  - ⚠ 页码口径提醒：本文件的 page 是 PDF **物理页**。historical.yaml 中 2024A
    total_assets 记的是 p.96，而 28,866,276,555.26 元实际出现在物理页 p.93（资产总计）
    与 p.94（负债和所有者权益总计）；合并时请注意两套页码来源可能不一致。
    其余抽查的年（2021A / 2022A / 2023A / 2025A / 2026H1）页码可对上。

